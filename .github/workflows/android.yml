name: Android CI

on:
  push:
    branches:
      - main
      - astra/pdf-merger-production-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore Gradle wrapper when missing
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew || ! -f gradlew.bat || ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
            chmod +x gradlew
          fi

      - name: Commit restored wrapper on hardening branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/astra/pdf-merger-production-hardening'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- gradlew gradlew.bat gradle/wrapper; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper
            git commit -m "build: restore complete Gradle wrapper"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
