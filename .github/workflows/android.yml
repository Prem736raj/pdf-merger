name: Android CI

on:
  push:
    branches:
      - main
      - astra/pdf-merger-production-hardening
  pull_request:
    branches:
      - main

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify committed Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Verify protected PDF independently with qpdf
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y qpdf
          fixture="$(find . -path '*/build/qpdf-fixtures/protected-aes128.pdf' -print -quit)"
          test -n "$fixture"
          qpdf --check --password='Open-Password-42' "$fixture"
          qpdf --show-encryption --password='Open-Password-42' "$fixture" | tee qpdf-encryption.txt
          grep -Eq 'R = 4|R=4' qpdf-encryption.txt
          grep -Eq 'AESv2|AES-128' qpdf-encryption.txt
          qpdf --password='Open-Password-42' --json --json-key=qpdf "$fixture" > qpdf.json
          python3 - <<'PY'
          import json
          data = json.load(open("qpdf.json", encoding="utf-8"))
          objects = data["qpdf"][1]
          encrypt_ref = objects["trailer"]["value"]["/Encrypt"]
          encrypt = objects["obj:" + encrypt_ref]["value"]
          assert encrypt["/Filter"] == "/Standard", encrypt
          assert encrypt["/V"] == 4, encrypt
          assert encrypt["/R"] == 4, encrypt
          assert encrypt["/Length"] == 128, encrypt
          std_cf = encrypt["/CF"]["/StdCF"]
          assert std_cf["/CFM"] == "/AESV2", encrypt
          print("Verified /Filter=/Standard /V=4 /R=4 /Length=128 /CFM=/AESV2")
          PY

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Lint release
        run: ./gradlew lintRelease --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
